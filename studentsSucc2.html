      let sourceArr = sourceTxt.split('\n')
      let translateArr = translateTxt.split('\n')
      let str = ''
      for (let i = 0; i < sourceArr.length; i++) {
         str += '<div class="f"><div class="s">'
         str += sourceArr[i]
         str += '</div><div class="t">'
         str += translateArr[i]
         str += '</div></div>'
      }
      document.getElementById("c").innerHTML = str;
      let translateLang = "en-US"
      const source = document.querySelectorAll(".s")
      const translate = document.querySelectorAll(".t")
      let cnt = 0
      function speakMinutes_source() {
         isPause = false;
         let sourceArr = []
         source.forEach(e => sourceArr.push(e.textContent))
         if (sourceArr.length > 0) {
            let txt = sourceArr[cnt]
            let utterance = new SpeechSynthesisUtterance(txt);
            utterance.onstart = () => {
               source[cnt].style.backgroundColor = "yellow"
            }
            // When the current utterance ends, speak the next one
            utterance.onend = function (event) {
               source[cnt].style.backgroundColor = "white"
               cnt++
               console.log("Speech ended, starting next minute.");
               isPause ? "" : speakMinutes_source(); // Recursively call the function fo the next item
            };
            // Handle potential errors
            utterance.onerror = function (event) {
               console.error("Speech synthesis error: " + event.error);
            };
            utterance.lang = "en-US"
            speechSynthesis.speak(utterance);
         }
      }
      function speakMinutes_translate() {
         isPause = false;
         let translateReadArr = []
         translate.forEach(e => translateReadArr.push(e.textContent))
         if (translateReadArr.length > 0) {
            let txt = translateReadArr[cnt]
            let utterance = new SpeechSynthesisUtterance(txt);
            utterance.onstart = () => {
               translate[cnt].style.backgroundColor = "yellow"
            }
            // When the current utterance ends, speak the next one
            utterance.onend = function (event) {
               translate[cnt].style.backgroundColor = "white"
               cnt++
               console.log("Speech ended, starting next minute.");
               isPause ? "" : speakMinutes_translate(); // Recursively call the function fo the next item
            };
            // Handle potential errors
            utterance.onerror = function (event) {
               console.error("Speech synthesis error: " + event.error);
            };

            utterance.lang = "vi-VN"
            speechSynthesis.speak(utterance);
         }
      }

      const speakBtn = document.querySelector("#speak");
      const pauseBtn = document.querySelector("#pause");

      const docBtn = document.querySelector("#doc");
      const stopBtn = document.querySelector("#stop");
      let isPause = false
      speakBtn.addEventListener("click", speakMinutes_source);
      docBtn.addEventListener("click", speakMinutes_translate);
